[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "megaquant"
version = "0.1.0"
description = "Generic PTQ pipeline for NVFP4 / FP8 / mixed-precision Hugging Face checkpoints"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Donz" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "huggingface_hub>=0.26",
]

[project.optional-dependencies]
modelopt = [
  "nvidia-modelopt[hf]==0.46.1",
]
llmcompressor = [
  "llmcompressor>=0.8",
  "compressed-tensors>=0.10",
]
gdn = [
  "kernels>=0.9",
  "flash-linear-attention",
]
hf = [
  "transformers>=4.56",
  "datasets>=3.0",
  "accelerate>=1.0",
  "safetensors>=0.5",
  "torch>=2.6",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/AvrovaDonz2026/Mega-Quantification"
Documentation = "https://github.com/AvrovaDonz2026/Mega-Quantification/blob/main/docs/ARCHITECTURE.md"

[project.scripts]
megaquant = "megaquant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/megaquant"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.hatch.build.targets.sdist]
include = [
  "src/megaquant",
  "recipes",
  "docs",
  "docker",
  "scripts",
  "Dockerfile",
  "Dockerfile.sglang",
  "docker-compose.yml",
  "docker-compose.ngc.yml",
  "LICENSE",
  "CONTRIBUTING.md",
  "README.md",
  "SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
