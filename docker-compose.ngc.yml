# Optional override: NGC PyTorch base for PTQ only (best sm_120 / RTX 5090).
# Requires: docker login nvcr.io
#
#   docker compose -f docker-compose.yml -f docker-compose.ngc.yml --profile gpu build
#
# Serve/eval stay on Dockerfile.sglang — do not mix ModelOpt NGC torch with SGLang.

services:
  megaquant:
    build:
      args:
        BASE_IMAGE: nvcr.io/nvidia/pytorch:25.08-py3
        INSTALL_TORCH: "0"
    image: megaquant:nvfp4-ngc

  quantize:
    build:
      args:
        BASE_IMAGE: nvcr.io/nvidia/pytorch:25.08-py3
        INSTALL_TORCH: "0"
    image: megaquant:nvfp4-ngc

  mixed:
    build:
      args:
        BASE_IMAGE: nvcr.io/nvidia/pytorch:25.08-py3
        INSTALL_TORCH: "0"
    image: megaquant:nvfp4-ngc

  w4a4:
    build:
      args:
        BASE_IMAGE: nvcr.io/nvidia/pytorch:25.08-py3
        INSTALL_TORCH: "0"
    image: megaquant:nvfp4-ngc

  serve-sglang:
    build:
      dockerfile: Dockerfile.sglang
    image: megaquant:sglang

  serve-vllm:
    build:
      dockerfile: Dockerfile.sglang
    image: megaquant:sglang

  eval-gpqa:
    build:
      dockerfile: Dockerfile.sglang
    image: megaquant:sglang

  shell:
    build:
      args:
        BASE_IMAGE: nvcr.io/nvidia/pytorch:25.08-py3
        INSTALL_TORCH: "0"
    image: megaquant:nvfp4-ngc
