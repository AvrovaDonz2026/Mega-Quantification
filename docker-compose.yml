name: "${COMPOSE_PROJECT_NAME:-megaquant}"

x-megaquant: &megaquant
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:12.8.1-devel-ubuntu24.04}
      INSTALL_TORCH: ${INSTALL_TORCH:-1}
      TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
  image: ${MEGAQUANT_IMAGE:-megaquant:nvfp4}
  pull_policy: missing
  stdin_open: true
  tty: true
  ipc: host
  shm_size: 64gb
  ulimits:
    memlock: -1
    stack: 67108864
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
    HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    HF_HOME: /cache/huggingface
    RECIPE: ${RECIPE:-recipes/qwen3.8-27b-nvfp4-w4a8.yaml}
    CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-}
    MEGAQUANT_DEVICE_MAP: ${MEGAQUANT_DEVICE_MAP:-auto}
    MEGAQUANT_LOW_MEMORY: ${MEGAQUANT_LOW_MEMORY:-1}
    MEGAQUANT_OFFLOAD_DIR: ${MEGAQUANT_OFFLOAD_DIR:-/opt/megaquant/offload}
    MEGAQUANT_MAX_MEMORY: ${MEGAQUANT_MAX_MEMORY:-}
    MEGAQUANT_GPU_HEADROOM_GIB: ${MEGAQUANT_GPU_HEADROOM_GIB:-1}
    MEGAQUANT_CPU_RESERVE_GIB: ${MEGAQUANT_CPU_RESERVE_GIB:-6}
    MEGAQUANT_BATCH_SIZE: ${MEGAQUANT_BATCH_SIZE:-}
    MEGAQUANT_NUM_THREADS: ${MEGAQUANT_NUM_THREADS:-}
    MEGAQUANT_PIN_MEMORY: ${MEGAQUANT_PIN_MEMORY:-1}
    OMP_NUM_THREADS: ${OMP_NUM_THREADS:-}
    MKL_NUM_THREADS: ${MKL_NUM_THREADS:-}
    TOKENIZERS_PARALLELISM: ${TOKENIZERS_PARALLELISM:-true}
    PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    CUDA_DEVICE_MAX_CONNECTIONS: ${CUDA_DEVICE_MAX_CONNECTIONS:-16}
    MEGAQUANT_EXTRA_ARGS: ${MEGAQUANT_EXTRA_ARGS:-}
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  volumes:
    - ${HF_CACHE:-./.cache/huggingface}:/cache/huggingface
    - ${MODELS_DIR:-./models}:/models
    - ${OUTPUTS_DIR:-./outputs}:/opt/megaquant/outputs
    - ${OFFLOAD_DIR:-./offload_folder}:/opt/megaquant/offload
    - ./recipes:/opt/megaquant/recipes
    - ./docs:/opt/megaquant/docs:ro
  working_dir: /opt/megaquant
  gpus: all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # Default: dry-run the Qwen3.8-27B NVFP4 W4A8 plan. Safe on `compose up`.
  megaquant:
    <<: *megaquant
    command: ["plan", "-c", "${RECIPE:-recipes/qwen3.8-27b-nvfp4-w4a8.yaml}"]

  # Real PTQ. Opt in explicitly so `compose up` never starts a 27B job.
  quantize:
    <<: *megaquant
    profiles: ["gpu"]
    command:
      [
        "quantize",
        "-c",
        "${RECIPE:-recipes/qwen3.8-27b-nvfp4-w4a8.yaml}",
      ]

  # 5090-safe mixed NVFP4 (max + ultrachat). Quality Local-Hessian:
  # RECIPE=recipes/qwen3.8-27b-nvfp4-mixed.yaml docker compose --profile gpu run --rm quantize
  mixed:
    <<: *megaquant
    profiles: ["gpu"]
    command:
      [
        "quantize",
        "-c",
        "recipes/qwen3.8-27b-nvfp4-mixed.5090.yaml",
      ]

  w4a4:
    <<: *megaquant
    profiles: ["gpu"]
    command:
      [
        "quantize",
        "-c",
        "recipes/qwen3.8-27b-nvfp4-w4a4.5090.yaml",
      ]

  shell:
    <<: *megaquant
    profiles: ["dev"]
    entrypoint: ["/bin/bash"]
    command: ["-l"]
