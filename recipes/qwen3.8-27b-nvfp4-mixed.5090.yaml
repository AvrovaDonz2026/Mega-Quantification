# Single-32GB-5090 + 64 GB RAM profile: mixed NVFP4/FP8 PTQ.
#
# NVIDIA public ckpt: NVFP4 group_size 16 on MLP+lm_head, FP8 on
# self_attn/linear_attn. Algorithm is **max**, not local_hessian — a 32 GB 5090
# cannot hold Hessian 2048. Packs VRAM−1GiB of weights, keeps the rest in RAM
# (MemTotal−6GiB), uses every CPU thread, and runs max-calib at 256×1024 with
# batch_size 4. Skip the vision constructor so auto device_map fills the GPU
# with the 27B LM. Use a local snapshot, not UPFS /model.
#
# Quality Local-Hessian + gated Nemotron v3: qwen3.8-27b-nvfp4-mixed.yaml.
# Export uses the W4A8 directory: this is the production mixed checkpoint
# that restore-mtp / eval / serve already follow (same layer map as nvfp4_w4a8).

name: qwen3.8-27b-nvfp4-mixed-5090
backend: modelopt
scheme: nvfp4_mixed
algorithm: max
kv_cache: fp8
family: qwen3_5
extra_ignore: []

model:
  source: Qwen/Qwen3.8-27B
  dtype: bfloat16
  trust_remote_code: true
  device_map: auto
  quantize_vision: false
  quantize_mtp: false

calibration:
  dataset: HuggingFaceH4/ultrachat_200k
  num_samples: 256
  max_seq_length: 1024
  batch_size: 4
  seed: 42
  with_images: false

export:
  output_dir: outputs/Qwen3.8-27B-NVFP4-W4A8
  format: hf
  pack: true
