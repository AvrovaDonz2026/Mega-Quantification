# NVIDIA-style mixed NVFP4/FP8 (intent of nvidia/Qwen3.8-27B-NVFP4):
#   NVFP4 on MLP + lm_head, FP8 on self-attn + linear-attn.
# Produced originally with nvidia-modelopt 0.48.0, Local-Hessian, 2048 samples.
#
# NVFP4 layers still use block size 32 (W4A8_NVFP4_FP8 / nvfp4_bs32), not 16.
# Vision, MTP, embeddings, and GDN extras (conv1d / in_proj_a / in_proj_b)
# stay BF16 via family qwen3_5. lm_head is quantized (do not extra_ignore it).

name: qwen3.8-27b-nvfp4-mixed
backend: modelopt
scheme: nvfp4_mixed
algorithm: local_hessian
kv_cache: fp8
family: qwen3_5
extra_ignore: []

model:
  source: Qwen/Qwen3.8-27B
  dtype: bfloat16
  trust_remote_code: true
  device_map: auto
  quantize_vision: false
  quantize_mtp: false

calibration:
  dataset: nvidia/Nemotron-Post-Training-Dataset-v2
  num_samples: 2048
  max_seq_length: 2048
  batch_size: 1
  seed: 42
  with_images: false

export:
  output_dir: outputs/Qwen3.8-27B-NVFP4-mixed
  format: hf
  pack: true
