# Optional Marlin/W4A16 export. Not the DGX Spark fast path.
#
# Published Spark tok/s (SGLang cookbook and GB10 measurements) use the existing
# mixed checkpoint: NVFP4 W4A4 group 16 on MLP, FP8 on attention, FP8 KV.
# Plain decode on GB10 is ~12 tok/s under a ~14 tok/s bandwidth ceiling, slower
# than the 5090's ~21 tok/s. The lever past that ceiling is speculative decode
# (DFlash / MTP) on that mixed checkpoint, not a second PTQ. Forcing W4A16
# Marlin reintroduces a BF16 activation read once native FP4 GEMM works.
#
# Kept so a 32 GB box can still emit MIXED_PRECISION layers tagged W4A16_NVFP4
# (max, 256x1024, batch 4). Do not start it while the mixed W4A8 eval is the job.

name: qwen3.8-27b-nvfp4-w4a16-mixed-5090
backend: modelopt
scheme: nvfp4_w4a16_mixed
algorithm: max
kv_cache: fp8
family: qwen3_5
extra_ignore: []

model:
  source: Qwen/Qwen3.8-27B
  dtype: bfloat16
  trust_remote_code: true
  device_map: auto
  quantize_vision: false
  quantize_mtp: false

calibration:
  dataset: HuggingFaceH4/ultrachat_200k
  num_samples: 256
  max_seq_length: 1024
  batch_size: 4
  seed: 42
  with_images: false

export:
  output_dir: outputs/Qwen3.8-27B-NVFP4-W4A16-mixed
  format: hf
  pack: true
