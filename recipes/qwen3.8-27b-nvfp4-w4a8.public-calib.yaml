# Same as qwen3.8-27b-nvfp4-w4a8.yaml but with a *public* calibration set.
# Nemotron-Post-Training-Dataset-v2 is gated and needs HF_TOKEN.
# Use this on GPU cloud pods / CI when you only have anonymous Hub access.
#
# Scheme nvfp4_w4a8 is the SGLang mixed map (NVFP4 gs16 MLP + FP8 attn),
# not W4A8_NVFP4_FP8 block 32.

name: qwen3.8-27b-nvfp4-w4a8-public-calib
backend: modelopt
scheme: nvfp4_w4a8
algorithm: max
kv_cache: fp8
family: qwen3_5
extra_ignore: []

model:
  source: Qwen/Qwen3.8-27B
  dtype: bfloat16
  trust_remote_code: true
  device_map: auto
  quantize_vision: false
  quantize_mtp: false

calibration:
  dataset: HuggingFaceH4/ultrachat_200k
  num_samples: 512
  max_seq_length: 2048
  batch_size: 1
  seed: 42
  with_images: false

export:
  output_dir: outputs/Qwen3.8-27B-NVFP4-W4A8
  format: hf
  pack: true
