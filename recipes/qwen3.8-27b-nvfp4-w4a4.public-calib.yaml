# Same as qwen3.8-27b-nvfp4-w4a4.yaml but with a *public* calibration set.
# Nemotron-Post-Training-Dataset-v2 is gated and needs HF_TOKEN.
# Use this on GPU cloud pods / CI when you only have anonymous Hub access.
# Single 32 GB 5090: prefer qwen3.8-27b-nvfp4-w4a4.5090.yaml (256×1024, batch 4).

name: qwen3.8-27b-nvfp4-w4a4-public-calib
backend: modelopt
scheme: nvfp4_w4a4
algorithm: max
kv_cache: fp8
family: qwen3_5
extra_ignore: []

model:
  source: Qwen/Qwen3.8-27B
  dtype: bfloat16
  trust_remote_code: true
  device_map: auto
  quantize_vision: false
  quantize_mtp: false

calibration:
  dataset: HuggingFaceH4/ultrachat_200k
  num_samples: 512
  max_seq_length: 2048
  batch_size: 1
  seed: 42
  with_images: false

export:
  output_dir: outputs/Qwen3.8-27B-NVFP4-W4A4
  format: hf
  pack: true
