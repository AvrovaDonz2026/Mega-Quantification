# Single-32GB-5090 + 64 GB RAM profile: SGLang-serving mixed NVFP4/FP8 PTQ.
#
# Same scheme as qwen3.8-27b-nvfp4-w4a8.yaml (nvfp4_w4a8 = NVIDIA mixed map,
# MIXED_PRECISION export). Not W4A8_NVFP4_FP8 block 32.
#
# Packs VRAM−1GiB of weights, keeps the rest in RAM (MemTotal−6GiB, not disk),
# uses every CPU thread, and runs max-calib at 256×1024 with batch_size 1 to
# keep lm_head within 32 GB VRAM. Skip the vision constructor so auto device_map
# fills the GPU with the 27B LM. Use a local snapshot, not UPFS /model.

name: qwen3.8-27b-nvfp4-w4a8-5090
backend: modelopt
scheme: nvfp4_w4a8
algorithm: max
kv_cache: fp8
family: qwen3_5
extra_ignore: []

model:
  source: Qwen/Qwen3.8-27B
  dtype: bfloat16
  trust_remote_code: true
  device_map: auto
  quantize_vision: false
  quantize_mtp: false

calibration:
  dataset: HuggingFaceH4/ultrachat_200k
  num_samples: 256
  max_seq_length: 1024
  batch_size: 1
  seed: 42
  with_images: false

export:
  output_dir: outputs/Qwen3.8-27B-NVFP4-W4A8
  format: hf
  pack: true
